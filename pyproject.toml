[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "repodoctor"
version = "0.1.0"
description = "Local-first repository health, security, and developer-experience auditing."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "RepoDoctor Contributors" }]
keywords = ["security", "static-analysis", "cli", "sarif", "repository"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "mypy>=1.10,<2"]

[project.scripts]
repodoctor = "repodoctor.cli:app"

[project.urls]
Homepage = "https://github.com/your-org/repodoctor"
Documentation = "https://github.com/your-org/repodoctor#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/repodoctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
