name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbf9c0a2d1f7907973b3f5eab7d5e2f
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - run: repodoctor scan . --format json --no-baseline
